name: recall digest

# Runs daily so the Safety Gate latest-alerts list is captured before it
# rolls over; the state file accumulates and digests/latest.md always shows
# the last 7 days.
on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: |
          mkdir -p data digests
          recall-radar --days 7 --state data/state.json -o digests/latest.md --json digests/latest.json
      - name: commit digest
        run: |
          git config user.name "recall-radar bot"
          git config user.email "actions@users.noreply.github.com"
          git add data digests
          git diff --cached --quiet || git commit -m "digest $(date -u +%F)"
          git push
